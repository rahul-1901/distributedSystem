services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:8-alpine
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
    env_file:
      - ./auth-service/.env.docker
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis

  hackathon-service:
    build:
      context: ./hackathon-service
    env_file:
      - ./hackathon-service/.env.docker
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis

  media-service:
    build:
      context: ./media-service
    env_file:
      - ./media-service/.env.docker
    restart: unless-stopped
    depends_on:
      - mongodb

  notification-service:
    build:
      context: ./notification-service
    env_file:
      - ./notification-service/.env.docker
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis

  api-gateway:
    build:
      context: ./api-gateway
    env_file:
      - ./api-gateway/.env.docker
    restart: unless-stopped
    depends_on:
      - auth-service
      - hackathon-service
      - media-service
      - notification-service
      
  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
    - "80:80"
    - "443:443"
    depends_on:
    - api-gateway
    volumes:
    - ./certbot/conf:/etc/letsencrypt
    - ./certbot/www:/var/www/certbot

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    # Bound to the host's loopback interface only — never reachable from
    # outside the EC2 instance, regardless of the security group. Access it
    # by SSH-tunneling into the box (see docs/observability.md), not through
    # nginx or the public domain. Prometheus has no built-in auth, so it must
    # never be exposed any other way.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    env_file:
      - ./grafana/.env.docker
    environment:
      - GF_USERS_ALLOW_SIGN_UP=false
    # Same loopback-only access model as Prometheus above. Grafana does have
    # its own login (credentials come from grafana/.env.docker), but keeping
    # it off the public internet entirely removes the need to trust that
    # login as the only line of defense.
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  mongo_data:
  prometheus_data:
  grafana_data: