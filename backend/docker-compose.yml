services:
  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - hacksprint-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - hacksprint-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./auth-service/.env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hacksprint-network

  hackathon-service:
    build:
      context: ./hackathon-service
    container_name: hackathon-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    env_file:
      - ./hackathon-service/.env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hacksprint-network

  media-service:
    build:
      context: ./media-service
    container_name: media-service
    restart: unless-stopped
    ports:
      - "5003:5003"
    env_file:
      - ./media-service/.env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - hacksprint-network

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "5005:5005"
    env_file:
      - ./notification-service/.env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - hacksprint-network

volumes:
  mongo_data:

networks:
  hacksprint-network:
    driver: bridge
