events {}

http {

    upstream gateway {
        server api-gateway:5000;
    }

    # HTTP → HTTPS
    server {
        listen 80;
        server_name rahul1901.prometeo.in;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {

        listen 443 ssl http2;
        server_name rahul1901.prometeo.in;

        ssl_certificate /etc/letsencrypt/live/rahul1901.prometeo.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rahul1901.prometeo.in/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        client_max_body_size 50M;

        location / {

            proxy_pass http://gateway;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}