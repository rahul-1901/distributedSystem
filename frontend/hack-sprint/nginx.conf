server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # Hashed build assets (dist/assets/*) are immutable — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the service worker — a stale copy would keep serving an
    # old cached app shell indefinitely (see public/service-worker.js).
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }

    # React Router owns every other path client-side. Without this fallback,
    # a direct load or refresh on any route but "/" (e.g. /dashboard,
    # /hackathon/some-slug) 404s, since no such file exists on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
